name: Raseen Growth & Marketing Automation

on:
  workflow_dispatch:

jobs:
  generate_growth_digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Daily Viral Marketing Content Digest
        run: node scripts/growth_marketing_engine.js

      - name: Upload Growth Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raseen-growth-digest
          path: |
            MARKETING_DISPATCH.md
            public/marketing/growth_digest.json
